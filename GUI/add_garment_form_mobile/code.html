<button class="w-full text-primary font-label-md text-label-md uppercase tracking-wider py-2 text-center underline">Cancel</button>
</div>
<script>
        // Simple script to toggle radio button visual state (since tailwind forms plugin doesn't fully style custom radios easily without extra classes)
        document.querySelectorAll('input[type="radio"]').forEach(radio => {
            radio.addEventListener('change', (e) => {
                document.querySelectorAll('input[name="' + e.target.name + '"]').forEach(r => {
                    const innerCircle = r.nextElementSibling.querySelector('.bg-primary');
                    const outerCircle = r.nextElementSibling.querySelector('.rounded-full');
                    if(r.checked) {
                        innerCircle.classList.remove('hidden');
                        outerCircle.classList.remove('border-outline-variant');
                        outerCircle.classList.add('border-primary');
                    } else {
                        innerCircle.classList.add('hidden');
                        outerCircle.classList.add('border-outline-variant');
                        outerCircle.classList.remove('border-primary');
                    }
                })
            });
        });
    </script>
